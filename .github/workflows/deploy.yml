# Test, build and deploy to Azure Container Apps.
#   main           -> movielist          (environment: production)
#   other branches -> movielist-feature  (environment: feature)
# Azure resources are created by infra/azure-setup.sh; the login uses OIDC
# (no stored secrets), with IDs from the repo variables AZURE_*.
name: deploy

on:
  push:
    branches: ["**"]

concurrency:
  group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'feature' }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RESOURCE_GROUP: rg-movielist
  APP_NAME: ${{ github.ref == 'refs/heads/main' && 'movielist' || 'movielist-feature' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'feature' }}
      url: https://${{ steps.deploy.outputs.fqdn }}
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        id: deploy
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --only-show-errors --output none
          fqdn=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          echo "Deployed $APP_NAME: https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
